<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#132f2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#d99b3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 64px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #f8fbff; letter-spacing: 0; }
      .subtitle { font: 400 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #b8c7d9; letter-spacing: 0; }
      .label { font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #f8fbff; letter-spacing: 0; }
      .cn { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #ffd166; letter-spacing: 0; }
      .desc { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #c8d5e4; letter-spacing: 0; }
      .node { fill: #132236; stroke: #2e4564; stroke-width: 2; filter: url(#shadow); }
      .quality { fill: #132a25; stroke: #42d9af; }
      .debug { fill: #2a1a2a; stroke: #ff6f91; }
      .final { fill: #26213d; stroke: #a78bfa; }
      .arrow { stroke: #6f86a4; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #ff6f91; stroke-width: 4; fill: none; stroke-dasharray: 10 10; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6f86a4"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ff6f91"/>
    </marker>
  </defs>

  <rect width="1800" height="760" fill="url(#bg)"/>
  <circle cx="1540" cy="110" r="220" fill="#42d9af" opacity="0.08"/>
  <circle cx="180" cy="640" r="260" fill="#a78bfa" opacity="0.08"/>

  <text x="90" y="105" class="title">Luban Loop</text>
  <text x="90" y="150" class="subtitle">From requirement to verified delivery / 从需求到可验证交付</text>

  <g transform="translate(70 235)">
    <rect class="node" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="26" y="58" class="label">Requirement</text>
    <text x="26" y="96" class="cn">需求输入</text>
    <text x="26" y="126" class="desc">User intent</text>
  </g>

  <g transform="translate(300 235)">
    <rect class="node" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="28" y="58" class="label">Builder</text>
    <text x="28" y="96" class="cn">营造</text>
    <text x="28" y="126" class="desc">Own the flow</text>
  </g>

  <g transform="translate(530 235)">
    <rect class="node" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="25" y="58" class="label">Chalkline</text>
    <text x="25" y="96" class="cn">墨斗</text>
    <text x="25" y="126" class="desc">Clarify tradeoffs</text>
  </g>

  <g transform="translate(760 235)">
    <rect class="node quality" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="38" y="58" class="label">Square</text>
    <text x="38" y="96" class="cn">规矩</text>
    <text x="38" y="126" class="desc">Quality guardrails</text>
  </g>

  <g transform="translate(990 235)">
    <rect class="node" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="48" y="58" class="label">Build</text>
    <text x="48" y="96" class="cn">实作</text>
    <text x="48" y="126" class="desc">Small complete change</text>
  </g>

  <g transform="translate(1220 235)">
    <rect class="node debug" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="22" y="58" class="label">Rootfinder</text>
    <text x="22" y="96" class="cn">寻因</text>
    <text x="22" y="126" class="desc">Root cause first</text>
  </g>

  <g transform="translate(1450 235)">
    <rect class="node quality" x="0" y="0" width="180" height="150" rx="18"/>
    <text x="38" y="58" class="label">Verify</text>
    <text x="38" y="96" class="cn">验证</text>
    <text x="38" y="126" class="desc">Evidence</text>
  </g>

  <g transform="translate(1110 500)">
    <rect class="node quality" x="0" y="0" width="210" height="150" rx="18"/>
    <text x="58" y="58" class="label">Gauge</text>
    <text x="58" y="96" class="cn">验尺</text>
    <text x="58" y="126" class="desc">Readiness review</text>
  </g>

  <g transform="translate(1390 500)">
    <rect class="node final" x="0" y="0" width="210" height="150" rx="18"/>
    <text x="70" y="58" class="label">Seal</text>
    <text x="70" y="96" class="cn">落印</text>
    <text x="70" y="126" class="desc">Handoff with risks</text>
  </g>

  <path class="arrow" d="M250 310 L290 310"/>
  <path class="arrow" d="M480 310 L520 310"/>
  <path class="arrow" d="M710 310 L750 310"/>
  <path class="arrow" d="M940 310 L980 310"/>
  <path class="arrow" d="M1170 310 L1210 310"/>
  <path class="arrow" d="M1400 310 L1440 310"/>
  <path class="arrow" d="M1545 390 C1545 445 1215 445 1215 490"/>
  <path class="arrow" d="M1320 575 L1380 575"/>
  <path class="loop" d="M1310 235 C1310 125 1080 125 1080 225"/>

  <text x="1110" y="120" class="subtitle">Failures go through Rootfinder first.</text>
  <text x="1110" y="158" class="subtitle">失败先寻因，再回到实作。</text>
</svg>
