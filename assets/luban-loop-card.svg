<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#12332c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142337"/>
      <stop offset="100%" stop-color="#101928"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a3"/>
      <stop offset="100%" stop-color="#d79b39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .title { font: 900 110px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #f8fbff; letter-spacing: 0; }
      .cn { font: 800 50px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: url(#gold); letter-spacing: 0; }
      .subtitle { font: 500 35px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #c7d4e6; letter-spacing: 0; }
      .small { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #eef6ff; letter-spacing: 0; }
      .role { font: 800 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #f8fbff; letter-spacing: 0; }
      .role-cn { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #ffd166; letter-spacing: 0; }
      .pill { fill: #15263a; stroke: #334c6a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="190" r="260" fill="#42d9af" opacity="0.10"/>
  <circle cx="250" cy="820" r="360" fill="#a78bfa" opacity="0.10"/>

  <g transform="translate(92 88)">
    <text x="0" y="105" class="title">Luban Loop</text>
    <text x="4" y="172" class="cn">鲁班闭环</text>
    <text x="4" y="250" class="subtitle">From requirement to verified delivery</text>
    <text x="4" y="302" class="subtitle">从需求到可验证交付</text>
  </g>

  <g transform="translate(100 470)" filter="url(#shadow)">
    <rect width="1400" height="280" rx="34" fill="url(#panel)" stroke="#2e4564" stroke-width="2"/>
    <g transform="translate(60 62)">
      <rect class="pill" x="0" y="0" width="145" height="92" rx="20"/>
      <text class="role" x="25" y="40">Builder</text>
      <text class="role-cn" x="42" y="70">营造</text>

      <rect class="pill" x="165" y="0" width="165" height="92" rx="20"/>
      <text class="role" x="190" y="40">Chalkline</text>
      <text class="role-cn" x="228" y="70">墨斗</text>

      <rect class="pill" x="350" y="0" width="145" height="92" rx="20"/>
      <text class="role" x="383" y="40">Square</text>
      <text class="role-cn" x="405" y="70">规矩</text>

      <rect class="pill" x="515" y="0" width="130" height="92" rx="20"/>
      <text class="role" x="548" y="40">Build</text>
      <text class="role-cn" x="557" y="70">实作</text>

      <rect class="pill" x="665" y="0" width="175" height="92" rx="20"/>
      <text class="role" x="693" y="40">Rootfinder</text>
      <text class="role-cn" x="733" y="70">寻因</text>

      <rect class="pill" x="860" y="0" width="145" height="92" rx="20"/>
      <text class="role" x="895" y="40">Verify</text>
      <text class="role-cn" x="913" y="70">验证</text>

      <rect class="pill" x="1025" y="0" width="145" height="92" rx="20"/>
      <text class="role" x="1062" y="40">Gauge</text>
      <text class="role-cn" x="1078" y="70">验尺</text>

      <rect class="pill" x="1190" y="0" width="130" height="92" rx="20"/>
      <text class="role" x="1230" y="40">Seal</text>
      <text class="role-cn" x="1233" y="70">落印</text>
    </g>

    <text x="64" y="205" class="small">Use Luban to implement: &lt;requirement&gt;</text>
    <text x="64" y="242" class="small">用 Luban 实现：&lt;需求&gt;</text>
  </g>

  <g transform="translate(1140 86)" opacity="0.92">
    <path d="M170 0 L322 88 L322 264 L170 352 L18 264 L18 88 Z" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <path d="M170 72 L260 124 L260 228 L170 280 L80 228 L80 124 Z" fill="none" stroke="#42d9af" stroke-width="10"/>
    <path d="M170 72 L170 280 M80 124 L260 228 M260 124 L80 228" stroke="#6f86a4" stroke-width="6" opacity="0.72"/>
  </g>
</svg>
